services:
  postgres:
    container_name: postgres-db-myproject
    image: postgres:17.5
    ports:
      - 5433:5432
    volumes:
      - ./pgdb:/var/lib/postgresql/data
    env_file: .env
    environment:
      - LC_ALL=C.UTF-8
    networks:
      - myproject-backend

  web:
    container_name: myproject
    build: .
    restart: "always"
    env_file: .env
    volumes:
      - ../../:/code
    ports:
      - "8000:8000"
    depends_on:
      - "postgres"
      - "redis"
    command: >
      bash -c "python /code/manage.py migrate --noinput &&
      python /code/manage.py runserver 0.0.0.0:8000"
    networks:
      - myproject-backend

  redis:
    image: redis:8.0.1
    restart: "always"
    container_name: redis
    command: redis-server --requirepass $REDIS_PASSWORD
    ports:
      - 6379:6379
    volumes:
      - ./redisdb:/var/lib/redis
    env_file: .env
    networks:
      - myproject-backend

  celery: &celery
    container_name: celery
    build:
      context: .
      dockerfile: celery.dockerfile
    env_file: .env
    restart: "always"
    volumes:
      - ../../:/code
    command: >
      bash -c "celery --app=myproject.celery:app worker
      --queues=default,scraping,enrichment,episodes,maintenance
      --concurrency=4 --loglevel=INFO"
    depends_on:
      - web
      - redis
      - postgres
    networks:
      - myproject-backend

  celery-beat:
    <<: *celery
    container_name: celery-beat
    command: >
      bash -c "celery --app=myproject.celery:app beat
      --scheduler django_celery_beat.schedulers:DatabaseScheduler --loglevel=INFO"
    depends_on:
      - celery

