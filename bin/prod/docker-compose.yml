services:
  app:
    container_name: app
    build: ../..
    restart: always
    env_file: .env
    volumes:
      - ../../:/code
    command: >
      bash -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      uwsgi --ini /conf/uwsgi.ini"
    depends_on:
      - postgres
      - redis
    networks:
      - nginx-proxy

  postgres:
    container_name: postgres-db
    image: postgres:17.5
    restart: always
    env_file: .env
    volumes:
      - ./pgdb:/var/lib/postgresql/data
    networks:
      - nginx-proxy

  redis:
    image: redis:8.0.1
    container_name: redis
    restart: always
    command: redis-server --requirepass $REDIS_PASSWORD
    env_file: .env
    volumes:
      - ./redisdb:/var/lib/redis
    networks:
      - nginx-proxy

  celery:
    container_name: celery
    build:
      context: ../..
      dockerfile: celery.dockerfile
    restart: always
    env_file: .env
    volumes:
      - ../../:/code
    command: >
      bash -c "celery --app=myproject.celery:app worker
      --queues=default,scraping,enrichment,episodes,maintenance
      --concurrency=4 --loglevel=INFO"
    depends_on:
      - app
      - redis
    networks:
      - nginx-proxy

  celery-beat:
    container_name: celery-beat
    build:
      context: ../..
      dockerfile: celery.dockerfile
    restart: always
    env_file: .env
    volumes:
      - ../../:/code
    command: >
      bash -c "celery --app=myproject.celery:app beat
      --scheduler django_celery_beat.schedulers:DatabaseScheduler --loglevel=INFO"
    depends_on:
      - celery
    networks:
      - nginx-proxy

networks:
  nginx-proxy:
    external: true
